<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Email Sent - Python Bank</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e3a8a,
                    #3b82f6
                );
        }

        .success-card {

            width: 100%;

            max-width: 500px;

            background: white;

            border-radius: 22px;

            padding: 40px;

            text-align: center;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.25);
        }

        .success-icon {

            font-size: 65px;

            margin-bottom: 15px;
        }

        h2 {

            color: #198754;

            font-weight: 700;
        }

        .email-box {

            background: #f8fafc;

            border-radius: 12px;

            padding: 15px;

            margin: 25px 0;

            word-break: break-word;

            font-weight: 600;
        }

        .btn-home {

            width: 100%;

            height: 55px;

            border-radius: 12px;

            font-size: 17px;

            font-weight: 600;
        }

    </style>

</head>

<body>

<div class="success-card">

    <div class="success-icon">
        ✅
    </div>

    <h2>
        Statement Sent Successfully
    </h2>

    <p class="text-muted">
        Your account statement has been sent to:
    </p>

    <div class="email-box">
        📧 {{ email }}
    </div>

    <p class="text-muted">
        Your {{ file_type|upper }} statement is attached to the email.
    </p>

    <a href="{{ url_for('home') }}"
       class="btn btn-primary btn-home">

        ← Back to Dashboard

    </a>

</div>

</body>

</html>
