<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit Money | Python Bank</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            background: linear-gradient(135deg,#0f172a,#1e3a8a,#3b82f6);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Arial, Helvetica, sans-serif;
        }

        .deposit-card{
            width:650px;
            border:none;
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 20px 40px rgba(0,0,0,.25);
        }

        .header{
            background:linear-gradient(90deg,#0d6efd,#4f46e5);
            color:white;
            padding:28px;
            text-align:center;
        }

        .header h2{
            margin:0;
            font-weight:bold;
        }

        .header p{
            margin:5px 0 0;
            opacity:.9;
        }

        .card-body{
            padding:35px;
        }

        .account-box{
            background:#f8f9fa;
            border-radius:15px;
            padding:20px;
            margin-bottom:30px;
        }

        .account-box h6{
            color:#6c757d;
            margin-bottom:5px;
        }

        .account-box h5{
            font-weight:bold;
        }

        .form-label{
            font-weight:600;
        }

        .input-group-text{
            font-size:22px;
            font-weight:bold;
        }

        .form-control{
            height:55px;
            font-size:20px;
        }

        .btn-deposit{
            height:55px;
            font-size:18px;
            font-weight:bold;
            border-radius:12px;
        }

        .btn-home{
            height:50px;
            font-size:17px;
            font-weight:bold;
            border-radius:12px;
            text-align: center;
        }

    </style>

</head>
<body>

<div class="card deposit-card">

    <!-- Header -->

    <div class="header">

        <h2>
            <i class="bi bi-bank2"></i>
            PYTHON BANK
        </h2>

        <p>Deposit Money Securely</p>

    </div>

    <div class="card-body">

        <!-- Account Information -->

        <div class="account-box">

            <div class="row text-center">

                <div class="col-md-4">

                    <h6>Account Number</h6>

                    <h5>{{ session["account"] }}</h5>

                </div>

                <div class="col-md-4">

                    <h6>Account Holder</h6>

                    <h5>{{ user["name"] }}</h5>

                </div>

                <div class="col-md-4">

                    <h6>Account Type</h6>

                    <h5>Savings</h5>

                </div>

            </div>

        </div>

        <!-- Deposit Form -->

        <form method="POST">

            <div class="mb-4">

                <label class="form-label">

                    Deposit Amount

                </label>

                <div class="input-group">

                    <span class="input-group-text">₹</span>

                    <input
                        type="number"
                        class="form-control"
                        name="amount"
                        placeholder="Enter amount"
                        min="1"
                        required>

                </div>

            </div>

            <div class="d-grid">

                <button class="btn btn-primary btn-deposit">

                    <i class="bi bi-plus-circle"></i>

                    Deposit Money

                </button>

            </div>

        </form>

        <hr class="my-4">

        <div class="d-grid">

            <a href="/home" class="btn btn-outline-secondary btn-home">

                <i class="bi bi-arrow-left"></i>

                Back to Dashboard

            </a>

        </div>

    </div>

</div>

</body>
</html>
