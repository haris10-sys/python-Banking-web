<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Receipt | Python Bank</title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, Helvetica, sans-serif;

            background: linear-gradient(
                135deg,
                #0f172a,
                #1e3a8a,
                #3b82f6
            );
        }


        /* MAIN RECEIPT */

        .receipt {
            width: 520px;

            background: #fffdf5;

            border-radius: 20px;

            overflow: hidden;

            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.30);
        }


        /* HEADER */

        .receipt-header {
            background: linear-gradient(
                90deg,
                #0d6efd,
                #4f46e5
            );

            color: white;

            text-align: center;

            padding: 28px;
        }

        .receipt-header h1 {
            margin: 0;

            font-size: 28px;

            font-weight: bold;
        }

        .receipt-header p {
            margin: 6px 0 0;

            font-size: 15px;
        }


        /* SUCCESS */

        .success {
            text-align: center;

            padding: 25px 20px 10px;
        }

        .success-icon {
            width: 55px;

            height: 55px;

            margin: auto;

            border-radius: 50%;

            background: #0d6efd;

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 28px;

            font-weight: bold;
        }

        .success h2 {
            margin: 12px 0 5px;

            font-size: 22px;
        }

        .success p {
            margin: 0;

            color: #6c757d;
        }


        /* RECEIPT BODY */

        .receipt-body {
            padding: 25px 35px 35px;
        }


        /* DETAILS */

        .details-box {
            background: #f8f9fa;

            border-radius: 15px;

            padding: 20px;
        }

        .detail-row {
            display: flex;

            justify-content: space-between;

            padding: 13px 0;

            border-bottom: 1px solid #dee2e6;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #6c757d;

            font-size: 14px;
        }

        .detail-value {
            font-weight: bold;

            color: #212529;
        }


        /* AMOUNT */

        .amount-box {
            text-align: center;

            margin: 25px 0;

            padding: 20px;

            border: 2px solid #0d6efd;

            border-radius: 15px;
        }

        .amount-box p {
            margin: 0 0 5px;

            color: #6c757d;
        }

        .amount {
            color: #0d6efd;

            font-size: 30px;

            font-weight: bold;
        }


        /* BALANCE */

        .balance-box {
            background: #eaf3ff;

            border-radius: 12px;

            padding: 16px;

            text-align: center;

            margin-bottom: 20px;
        }

        .balance-box p {
            margin: 0 0 5px;

            color: #6c757d;
        }

        .balance {
            font-size: 22px;

            font-weight: bold;

            color: #0d6efd;
        }


        /* HOME BUTTON */

        .home-button {
            display: block;

            width: 100%;

            padding: 14px;

            background: #0d6efd;

            color: white;

            border: 2px solid #0d6efd;

            border-radius: 10px;

            text-align: center;

            text-decoration: none;

            font-size: 16px;

            font-weight: bold;
        }

        .home-button:hover {
            background: #0b5ed7;
        }


        /* PRINT BUTTON */

        .print-button {
            display: block;

            width: 100%;

            padding: 14px;

            margin-top: 12px;

            background: white;

            color: #0d6efd;

            border: 2px solid #0d6efd;

            border-radius: 10px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .print-button:hover {
            background: #eaf3ff;
        }


        /* FOOTER */

        .footer {
            text-align: center;

            margin-top: 20px;

            color: #6c757d;

            font-size: 12px;
        }


        /* PRINT */

        @media print {

            body {
                background: white;
            }

            .receipt {
                box-shadow: none;
            }

            .home-button,
            .print-button {
                display: none;
            }

        }

    </style>

</head>


<body>


<div class="receipt">


    <!-- HEADER -->

    <div class="receipt-header">

        <h1>PYTHON BANK</h1>

        <p>Transaction Receipt</p>

    </div>


    <!-- SUCCESS -->

    <div class="success">

        <div class="success-icon">
            ✓
        </div>

        <h2>
            Transaction Successful
        </h2>

        <p>
            Your transaction has been completed.
        </p>

    </div>


    <!-- RECEIPT DETAILS -->

    <div class="receipt-body">


        <div class="details-box">


            <div class="detail-row">

                <span class="detail-label">
                    Customer
                </span>

                <span class="detail-value">
                    {{ name }}
                </span>

            </div>

            
            <div class="detail-row">

                <span class="detail-label">
                    Account
                </span>

                <span class="detail-value">
                    {{ account }}
                </span>

            </div>




            <div class="detail-row">

                <span class="detail-label">
                    Transaction
                </span>

                <span class="detail-value">
                    {{ transaction }}
                </span>

            </div>


            <div class="detail-row">

                <span class="detail-label">
                    Date
                </span>

                <span class="detail-value">
                    {{ date }}
                </span>

            </div>


            <div class="detail-row">

                <span class="detail-label">
                    Time
                </span>

                <span class="detail-value">
                    {{ time }}
                </span>

            </div>


        </div>

          <!-- AMOUNT -->

            <div class="amount-box">

                <p>
                    Transaction Amount
                </p>

                <div class="amount">
                    ₹{{ amount }}
                </div>

            </div>


       



        <!-- BUTTONS -->

        <a href="/home" class="home-button">
            Back to Dashboard
        </a>


        <button
            onclick="window.print()"
            class="print-button">
            Print Receipt
        </button>


        <div class="footer">

            Thank You For Banking With Us

        </div>


    </div>

</div>


</body>

</html>
