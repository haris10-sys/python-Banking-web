<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Transfer Money | Python Bank</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 15px;

            background: linear-gradient(
                135deg,
                #0f172a,
                #1e3a8a,
                #3b82f6
            );

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, Helvetica, sans-serif;
        }


        /* MAIN CARD */

        .transfer-card {

            width: 100%;

            max-width: 650px;

            border: none;

            border-radius: 22px;

            overflow: hidden;

            box-shadow:
                0 20px 45px rgba(0, 0, 0, .3);
        }


        /* HEADER */

        .bank-header {

            background: linear-gradient(
                90deg,
                #0d6efd,
                #4f46e5
            );

            color: white;

            text-align: center;

            padding: 28px 15px;
        }


        .bank-header h2 {

            font-size: 26px;

            font-weight: bold;

            margin-bottom: 5px;
        }


        .bank-header p {

            margin: 0;

            font-size: 14px;
        }


        /* BODY */

        .card-body {

            padding: 30px;

            background: white;
        }


        /* ACCOUNT BOX */

        .account-box {

            background: #f8f9fa;

            border-radius: 15px;

            padding: 20px 10px;

            margin-bottom: 30px;
        }


        .account-box h6 {

            color: #6c757d;

            font-size: 13px;

            margin-bottom: 6px;
        }


        .account-box h5 {

            font-size: 15px;

            font-weight: bold;

            margin: 0;

            word-break: break-word;
        }


        /* TITLE */

        .section-title {

            text-align: center;

            margin-bottom: 25px;
        }


        .section-title h4 {

            font-size: 21px;

            font-weight: bold;

            margin-bottom: 5px;
        }


        .section-title p {

            color: #6c757d;

            font-size: 14px;

            margin: 0;
        }


        /* FORM */

        .form-label {

            font-weight: bold;

            font-size: 15px;

            margin-bottom: 8px;
        }


        .form-control {

            height: 52px;

            border: 2px solid #dbe4f0;

            border-radius: 12px;

            font-size: 16px;

            padding: 10px 15px;
        }


        .form-control:focus {

            border-color: #0d6efd;

            box-shadow:
                0 0 0 3px rgba(13, 110, 253, .12);
        }


        /* TRANSFER BUTTON */

        .transfer-btn {

            width: 100%;

            height: 55px;

            margin-top: 10px;

            border: none;

            border-radius: 12px;

            background: #0d6efd;

            color: white;

            font-size: 18px;

            font-weight: bold;

            transition: .25s;
        }


        .transfer-btn:hover {

            background: #0958c7;

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(13, 110, 253, .25);
        }


        /* BACK BUTTON */

        .home-btn {

            width: 100%;

            height: 52px;

            margin-top: 15px;

            border-radius: 12px;

            font-size: 17px;

            font-weight: bold;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 576px) {

            body {

                padding: 8px;

                align-items: flex-start;
            }


            .transfer-card {

                width: 100%;

                margin-top: 10px;

                border-radius: 16px;
            }


            /* HEADER */

            .bank-header {

                padding: 20px 10px;
            }


            .bank-header h2 {

                font-size: 22px;
            }


            .bank-header p {

                font-size: 13px;
            }


            /* BODY */

            .card-body {

                padding: 18px 12px;
            }


            /* ACCOUNT BOX */

            .account-box {

                padding: 15px 5px;

                margin-bottom: 22px;
            }


            .account-box h6 {

                font-size: 10px;
            }


            .account-box h5 {

                font-size: 12px;
            }


            /* TITLE */

            .section-title {

                margin-bottom: 20px;
            }


            .section-title h4 {

                font-size: 19px;
            }


            .section-title p {

                font-size: 12px;
            }


            /* INPUTS */

            .form-label {

                font-size: 14px;
            }


            .form-control {

                height: 50px;

                font-size: 15px;
            }


            /* TRANSFER BUTTON */

            .transfer-btn {

                height: 52px;

                font-size: 16px;
            }


            /* BACK BUTTON */

            .home-btn {

                height: 50px;

                font-size: 15px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         MAIN CARD
    ========================= -->

    <div class="card transfer-card">


        <!-- HEADER -->

        <div class="bank-header">

            <h2>
                PYTHON BANK
            </h2>

            <p>
                Money Transfer
            </p>

        </div>


        <!-- BODY -->

        <div class="card-body">


            <!-- =========================
                 ACCOUNT INFORMATION
            ========================= -->

            <div class="account-box">

                <div class="row text-center">


                    <div class="col-4">

                        <h6>
                            Account Number
                        </h6>

                        <h5>
                            {{ session["account"] }}
                        </h5>

                    </div>


                    <div class="col-4">

                        <h6>
                            Account Holder
                        </h6>

                        <h5>
                            {{ user["name"] }}
                        </h5>

                    </div>


                    <div class="col-4">

                        <h6>
                            Account Type
                        </h6>

                        <h5>
                            Savings
                        </h5>

                    </div>


                </div>

            </div>


            <!-- =========================
                 TITLE
            ========================= -->

            <div class="section-title">

                <h4>
                    Transfer Money
                </h4>

                <p>
                    Send money to another account
                </p>

            </div>


            <!-- =========================
                 TRANSFER FORM
            ========================= -->

            <form method="POST">


                <!-- RECEIVER -->

                <div class="mb-3">

                    <label
                        for="receiver"
                        class="form-label">

                        Receiver Account Number

                    </label>


                    <input
                        type="text"
                        id="receiver"
                        name="receiver"
                        class="form-control"
                        placeholder="Enter receiver account number"
                        required>

                </div>


                <!-- AMOUNT -->

                <div class="mb-3">

                    <label
                        for="amount"
                        class="form-label">

                        Transfer Amount

                    </label>


                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        class="form-control"
                        placeholder="Enter amount"
                        min="1"
                        required>

                </div>


                <!-- TRANSFER BUTTON -->

                <button
                    type="submit"
                    class="transfer-btn">

                    Transfer Money

                </button>


            </form>


            <!-- BACK BUTTON -->

            <div class="d-grid">

                <a
                    href="/home"
                    class="btn btn-outline-secondary home-btn">

                    Back to Dashboard

                </a>

            </div>


        </div>

    </div>


</body>

</html>
