<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw Money</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:linear-gradient(135deg,#0f172a,#1e3a8a,#3b82f6);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .withdraw-card{
            width:500px;
            border:none;
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 15px 35px rgba(0,0,0,.3);
        }

        .header{
            background:linear-gradient(90deg,#dc3545,#b02a37);
            color:white;
            text-align:center;
            padding:30px;
        }

        .header h2{
            margin:0;
            font-weight:bold;
        }

        .card-body{
            padding:35px;
        }

        .icon{
            font-size:55px;
            margin-bottom:10px;
        }

        .form-control{
            height:55px;
            font-size:20px;
            border-radius:12px;
        }

        .btn-withdraw{
            height:55px;
            font-size:18px;
            font-weight:bold;
            border-radius:12px;
        }

        .btn-home{
            height:50px;
            border-radius:12px;
            font-weight:bold;
        }

    </style>

</head>
<body>

<div class="card withdraw-card">

    <div class="header">

        <div class="icon">
            💳
        </div>

        <h2>Withdraw Money</h2>

        <small>Secure Cash Withdrawal</small>

    </div>

    <div class="card-body">

        <form method="POST">

            <div class="mb-4">

                <label class="form-label fw-bold">
                    Enter Amount
                </label>

                <input
                    type="number"
                    name="amount"
                    class="form-control"
                    placeholder="Enter withdrawal amount"
                    required
                    min="1">

            </div>

            <div class="d-grid mb-3">

                <button class="btn btn-danger btn-withdraw">

                    Withdraw Money

                </button>

            </div>

        </form>

        <div class="d-grid">

            <a href="/home" class="btn btn-outline-primary btn-home">

                Back to Dashboard

            </a>

        </div>

    </div>

</div>

</body>
</html>
